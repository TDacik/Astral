name: Run tests

on: [push, pull_request]

jobs:

  setup:
    uses: ./.github/workflows/setup.yml

  regression-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Run regression tests
        run: python3 scripts/run_tests.py
